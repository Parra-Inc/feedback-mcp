name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: |
          pnpm --filter @feedback-mcp/server typecheck
          pnpm --filter @feedback-mcp/site typecheck
      - name: Unit tests
        run: pnpm --filter @feedback-mcp/server test
      - name: Smoke test (build + boot + API/MCP/OAuth end to end)
        run: bash apps/server/scripts/smoke.sh
      - name: Build site
        run: pnpm --filter @feedback-mcp/site build
